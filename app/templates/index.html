{% extends "base.html" %}
{% block body %}
<h1 class="mb-4 text-2xl font-bold">课程作业提交系统</h1>
<p class="mb-6 text-slate-600">请选择课程后注册、登录并提交作业。</p>
{% if courses %}
<div class="grid gap-4 sm:grid-cols-2">
  {% for course in courses %}
  <section class="rounded-xl border bg-white p-4 shadow-sm">
    <h2 class="text-lg font-semibold">{{ course.title }}</h2>
    <p class="mb-4 text-xs text-slate-500">ID: {{ course.id }}</p>
    <a href="{{ url_for('public.course_landing', course_id=course.id) }}" class="rounded bg-indigo-600 px-3 py-2 text-sm text-white">进入课程</a>
  </section>
  {% endfor %}
</div>
{% else %}
<p class="rounded border bg-white p-4 text-slate-600">暂无可用课程，请联系教师创建课程。</p>
{% endif %}
<p class="mt-8"><a href="{{ url_for('teacher.teacher_login') }}" class="text-sm text-indigo-600 hover:underline">教师入口</a></p>
{% endblock %}

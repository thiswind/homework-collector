{% extends "base.html" %}
{% block body %}
<h1 class="mb-2 text-2xl font-bold">{{ course.course_title }}</h1>
<p class="mb-6 text-sm text-slate-500">课程 ID：{{ course.course_id }} · 名册人数：{{ roster_count }}</p>
<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  <a href="{{ url_for('teacher.course_edit', course_id=course.course_id) }}" class="rounded-xl border bg-white p-4 shadow-sm hover:bg-slate-50">
    <h2 class="font-semibold">课程与作业设置</h2>
    <p class="mt-1 text-sm text-slate-600">维护作业列表和模板。</p>
  </a>
  <a href="{{ url_for('teacher.roster_view', course_id=course.course_id) }}" class="rounded-xl border bg-white p-4 shadow-sm hover:bg-slate-50">
    <h2 class="font-semibold">名册管理</h2>
    <p class="mt-1 text-sm text-slate-600">导入、添加、删除学生和重置密码。</p>
  </a>
  <a href="{{ url_for('teacher.export_full', course_id=course.course_id) }}" class="rounded-xl border bg-white p-4 shadow-sm hover:bg-slate-50">
    <h2 class="font-semibold">导出总表</h2>
    <p class="mt-1 text-sm text-slate-600">下载全班提交状态 CSV。</p>
  </a>
</div>
<h2 class="mb-2 mt-8 text-lg font-semibold">作业</h2>
<div class="space-y-3">
  {% for a in course.assignments %}
  <div class="flex flex-wrap items-center justify-between gap-2 rounded border bg-white p-3">
    <div>
      <div class="font-medium">{{ a.title }}</div>
      <div class="text-xs text-slate-500">{{ a.id }}</div>
    </div>
    <div class="flex flex-wrap gap-2">
      <a href="{{ url_for('teacher.assignment_submission_status', course_id=course.course_id, assignment_id=a.id) }}" class="rounded border px-3 py-1.5 text-sm">提交进度</a>
      <a href="{{ url_for('teacher.download_zip', course_id=course.course_id, assignment_id=a.id) }}" class="rounded border px-3 py-1.5 text-sm">ZIP</a>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}

{% extends "base.html" %}
{% block body %}
<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <h1 class="text-2xl font-bold">课程管理</h1>
  <a href="{{ url_for('teacher.course_new') }}" class="rounded bg-indigo-600 px-3 py-2 text-sm text-white">创建课程</a>
</div>
{% if courses %}
<div class="grid gap-4 sm:grid-cols-2">
  {% for course in courses %}
  <section class="rounded-xl border bg-white p-4 shadow-sm">
    <h2 class="text-lg font-semibold">{{ course.title }}</h2>
    <p class="text-xs text-slate-500">ID: {{ course.id }} · {{ course.status }}</p>
    <div class="mt-4 flex flex-wrap gap-2">
      <a href="{{ url_for('teacher.course_dashboard', course_id=course.id) }}" class="rounded border px-3 py-1.5 text-sm">管理</a>
      <a href="{{ url_for('public.course_landing', course_id=course.id) }}" class="rounded border px-3 py-1.5 text-sm">学生入口</a>
    </div>
  </section>
  {% endfor %}
</div>
{% else %}
<p class="rounded border bg-white p-4 text-slate-600">尚未创建课程。</p>
{% endif %}
{% endblock %}

{% extends "base.html" %}
{% block body %}
<h1 class="mb-2 text-2xl font-bold">{{ course.course_title }}</h1>
<p class="mb-6 text-sm text-slate-500">课程 ID：{{ course.course_id }}</p>
<div class="flex flex-col gap-3 sm:flex-row">
  <a href="{{ url_for('student.enroll', course_id=course.course_id) }}" class="rounded-lg bg-indigo-600 px-4 py-3 text-center font-medium text-white hover:bg-indigo-700">学生初次注册</a>
  <a href="{{ url_for('student.login', course_id=course.course_id) }}" class="rounded-lg border border-indigo-600 px-4 py-3 text-center font-medium text-indigo-700 hover:bg-indigo-50">学生登录</a>
</div>
{% if course.assignments %}
<h2 class="mb-2 mt-8 text-lg font-semibold">作业列表</h2>
<ul class="space-y-2">
  {% for a in course.assignments %}
  <li class="rounded border bg-white px-3 py-2">{{ a.title }} <span class="text-xs text-slate-500">({{ a.id }})</span></li>
  {% endfor %}
</ul>
{% endif %}
{% endblock %}
